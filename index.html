<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23164ACF%27/%3E%3Ctext x=%2732%27 y=%2742%27 text-anchor=%27middle%27 font-family=%27Arial,Helvetica,sans-serif%27 font-weight=%27800%27 font-size=%2728%27 fill=%27white%27%3ESM%3C/text%3E%3C/svg%3E">
  <title>SM Cinema – Movies now showing</title>
  <meta name="description" content="Buy movie tickets online at SM Cinema. Now showing, coming soon, IMAX, Director's Club and more.">
  <script>try{var t=localStorage.getItem('sm.theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="bg-white">
  <a class="visually-hidden" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <!-- Hero -->
    <section class="hero" id="hero" aria-roledescription="carousel" aria-label="Featured movies">
      <div class="slides"></div>
      <div class="container content">
        <span class="eyebrow"></span>
        <h1></h1>
        <p class="sub"></p>
        <div class="chips"></div>
        <div class="actions">
          <a class="btn btn-primary btn-lg cta-main" href="movie.html"></a>
          <button class="btn btn-ghost btn-lg cta-alt" type="button"></button>
        </div>
      </div>
      <div class="controls">
        <div class="thumbs"></div>
        <div class="dots"></div>
        <div class="arrows">
          <button class="arrow prev" aria-label="Previous slide"><span class="ms">chevron_left</span></button>
          <button class="arrow next" aria-label="Next slide"><span class="ms">chevron_right</span></button>
        </div>
      </div>
    </section>

    <!-- Quick book -->
    <section class="container home-quickbook" aria-label="Quick book">
      <div class="quickbook">
        <div class="qb"><label for="qbMovie">Movie</label><select id="qbMovie"></select></div>
        <div class="qb"><label for="qbCinema">Cinema</label><select id="qbCinema"></select></div>
        <div class="qb"><label for="qbDate">Date</label><select id="qbDate"></select></div>
        <div class="qb"><label for="qbTime">Time</label><select id="qbTime"></select></div>
        <div class="go"><button class="btn btn-primary btn-lg" id="qbGo"><span class="ms">confirmation_number</span>Find showtimes</button></div>
      </div>
    </section>

    <!-- Movies -->
    <section class="section" id="now-showing">
      <div class="container">
        <div class="search-banner" id="searchBanner" hidden><span>Showing results for “<b id="searchTerm"></b>”</span><button class="link" id="clearSearch">Clear</button></div>
        <div class="section-head">
          <div><span class="eyebrow blue">Now showing at</span><div data-cinema-picker></div></div>
          <div class="home-toolbar" style="margin:0">
            <div class="filters" id="formatFilters" role="group" aria-label="Filter by format">
              <span class="lbl">Format</span>
              <button class="chip sm" data-f="All" aria-pressed="true">All</button>
              <button class="chip sm" data-f="2D" aria-pressed="false">2D</button>
              <button class="chip sm" data-f="3D" aria-pressed="false">3D</button>
              <button class="chip sm" data-f="IMAX" aria-pressed="false">IMAX</button>
              <button class="chip sm" data-f="Director's Club" aria-pressed="false">Director's Club</button>
            </div>
          </div>
        </div>
        <div class="tabs" role="tablist" data-tabs>
          <button role="tab" aria-selected="true" aria-controls="panelNow" id="tabNow">Now showing <span class="count" id="countNow"></span></button>
          <button role="tab" aria-selected="false" aria-controls="panelSoon" id="tabSoon">Coming soon <span class="count" id="countSoon"></span></button>
        </div>
        <div class="tabpanel mt-5" id="panelNow" role="tabpanel" aria-labelledby="tabNow"><div class="poster-grid" id="gridNow"></div></div>
        <div class="tabpanel mt-5" id="panelSoon" role="tabpanel" aria-labelledby="tabSoon" hidden><div class="poster-grid" id="gridSoon"></div></div>
      </div>
    </section>

    <!-- Experience teaser -->
    <section class="section" id="coming-soon-anchor">
      <div class="container">
        <div class="section-head">
          <div><span class="eyebrow blue">Experience</span><h2>Choose how you want to watch</h2><p>Same movie, different experience. Compare formats, then jump straight to their showtimes.</p></div>
          <a class="btn btn-secondary" href="experience.html">Compare all formats</a>
        </div>
        <div class="xp-teaser" id="xpTeaser"></div>
      </div>
    </section>

    <!-- Promos -->
    <section class="section">
      <div class="container">
        <div class="section-head"><div><span class="eyebrow blue">Deals and rewards</span><h2>More movie for your money</h2></div></div>
        <div class="promo-grid" id="promos"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script>SMUI.init({ active: 'movies' });</script>
  <script src="js/home.js"></script>
</body>
</html>
